name: Hybrid AI safety tests
on:
  push:
    branches:
      - upgrade/hybrid-ai-safe-v1
    paths:
      - 'js/supabase-sync.js'
      - 'js/learning-backup.js'
      - 'tests/**'
      - '.github/workflows/hybrid-ai-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check js/supabase-sync.js
          node --check js/learning-backup.js
          node --check js/app.js
      - name: Run sync unit tests
        run: node --test tests/supabase-sync.test.cjs
