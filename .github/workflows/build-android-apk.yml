name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK package, signature and contents
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes"
          # A minimal online WebView wrapper can be small; do not assume a multi-MB APK.
          test "$BYTES" -ge 8192 || { echo "::error::APK is suspiciously small"; exit 1; }
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" > /tmp/git-apk-entries.txt
          grep -Eq '^classes([0-9]+)?[.]dex$' /tmp/git-apk-entries.txt || { echo "::error::Missing classes.dex"; exit 1; }
 || { echo "::error::Missing classes.dex"; exit 1; }
          grep -Fxq 'AndroidManifest.xml' /tmp/git-apk-entries.txt || { echo "::error::Missing AndroidManifest.xml"; exit 1; }
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/git-apk-badging.txt
          grep -Fq "package: name='vn.git.chinesetrainer'" /tmp/git-apk-badging.txt || { echo "::error::Unexpected applicationId"; exit 1; }
          VERSION_CODE=$(sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" /tmp/git-apk-badging.txt | head -1)
          test -n "$VERSION_CODE" || { echo "::error::Missing APK versionCode"; exit 1; }
          echo "APK_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "### Verified APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version code: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: vn.git.chinesetrainer" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP integrity, DEX, manifest and APK signature: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- This is a debug APK; installation compatibility and runtime still need device testing." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: GIT-Chinese-Trainer-Android-V${{ env.APK_VERSION_CODE }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
